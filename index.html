<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion Immeubles Pro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<style>
body { padding: 20px; background-color: #f8f9fa; font-family: "Segoe UI", sans-serif; }
.table-container { max-height: 400px; overflow-y: auto; margin-top:20px; }
#tenantsTable tbody tr:nth-child(odd) { background-color: #ffffff; }
#tenantsTable tbody tr:nth-child(even) { background-color: #e9ecef; }
#tenantsTable tbody tr:hover { background-color: #d1ecf1; transition:0.3s; }
th { cursor: pointer; }
th.sorted-asc::after { content: " ▲"; }
th.sorted-desc::after { content: " ▼"; }
select, input { min-width: 120px; }
.logo { max-height: 60px; margin-bottom: 15px; }
.btn { box-shadow: 0 2px 5px rgba(0,0,0,0.15); transition: 0.2s; }
.btn:hover { transform: translateY(-2px); }
.card { box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s; }
.card:hover { transform: translateY(-2px); }
.modal-content { border-radius: 12px; }
@media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; top: 0; left: 0; width: 100%; }
}
</style>
</head>
<body>

<div class="container">
    <div class="text-center mb-3">
        <h2 class="mb-3">🏢 Gestion Immeubles et Locataires Pro</h2>
    </div>

    <!-- Dashboard -->
    <div class="row mb-3" id="dashboard">
        <div class="col-md-3 mb-2">
            <div class="card text-bg-primary text-center">
                <div class="card-body">
                    <h5 class="card-title">Total Locataires</h5>
                    <p class="card-text fs-4" id="totalTenants">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-2">
            <div class="card text-bg-success text-center">
                <div class="card-body">
                    <h5 class="card-title">Loyers Payés</h5>
                    <p class="card-text fs-4" id="totalPaid">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-2">
            <div class="card text-bg-danger text-center">
                <div class="card-body">
                    <h5 class="card-title">Loyers En Retard</h5>
                    <p class="card-text fs-4" id="totalLate">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-2">
            <div class="card text-bg-warning text-center">
                <div class="card-body">
                    <h5 class="card-title">Dépenses</h5>
                    <p class="card-text fs-4" id="totalExpenses">0</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Gestion immeubles et unités -->
    <div class="mb-3">
        <label for="selectBuilding" class="form-label">Immeuble :</label>
        <select id="selectBuilding" class="form-select"></select>
        <button class="btn btn-success mt-2" data-bs-toggle="modal" data-bs-target="#modalBuilding">Ajouter Immeuble</button>
        <button class="btn btn-danger mt-2" id="deleteBuilding">Supprimer Immeuble</button>
    </div>

    <div class="mb-3">
        <label for="selectUnit" class="form-label">Unité :</label>
        <select id="selectUnit" class="form-select"></select>
        <button class="btn btn-success mt-2" data-bs-toggle="modal" data-bs-target="#modalUnit">Ajouter Unité</button>
        <button class="btn btn-danger mt-2" id="deleteUnit">Supprimer Unité</button>
    </div>

    <div class="mb-3 d-flex gap-2">
        <input id="searchInput" class="form-control" placeholder="Recherche par locataire, statut ou unité">
        <select id="unitTypeFilter" class="form-select">
            <option value="">Tous les types</option>
            <option>Appartement</option>
            <option>Studio</option>
            <option>Magasin</option>
            <option>Autre</option>
        </select>
    </div>

    <!-- Table locataires et dépenses -->
    <div class="table-container mb-3">
        <table class="table table-bordered table-striped" id="tenantsTable">
            <thead class="table-dark">
                <tr>
                    <th data-col="name">Locataire</th>
                    <th data-col="rent">Loyer</th>
                    <th data-col="date">Date Paiement</th>
                    <th data-col="paymentMode">Mode Paiement</th>
                    <th data-col="status">Statut</th>
                    <th>Unité</th>
                    <th>Type</th>
                    <th data-col="expense">Dépense</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="mb-4">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTenant">Ajouter un locataire / dépense</button>
        <button id="btnPrint" class="btn btn-secondary">Imprimer</button>
        <button id="btnExportPDF" class="btn btn-danger">Exporter en PDF</button>
    </div>
</div>

<!-- Zone pour impression / PDF -->
<div id="printArea" style="display:none;"></div>

<!-- Modales -->
<!-- Immeuble -->
<div class="modal fade" id="modalBuilding" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Ajouter Immeuble</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><input type="text" id="inputBuildingName" class="form-control" placeholder="Nom de l'immeuble"></div>
      <div class="modal-footer"><button type="button" class="btn btn-primary" id="saveBuilding">Enregistrer</button></div>
    </div>
  </div>
</div>

<!-- Unité -->
<div class="modal fade" id="modalUnit" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Ajouter Unité</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="text" id="inputUnitName" class="form-control mb-2" placeholder="Nom de l'unité">
        <select id="inputUnitType" class="form-select">
            <option>Appartement</option>
            <option>Studio</option>
            <option>Magasin</option>
            <option>Autre</option>
        </select>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-primary" id="saveUnit">Enregistrer</button></div>
    </div>
  </div>
</div>

<!-- Locataire / Dépense -->
<div class="modal fade" id="modalTenant" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Ajouter / Modifier Locataire ou Dépense</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="text" id="tenantName" class="form-control mb-2" placeholder="Nom locataire ou dépense">
        <input type="number" id="tenantRent" class="form-control mb-2" placeholder="Loyer / Montant dépense">
        <input type="date" id="tenantDate" class="form-control mb-2">
        <select id="tenantPaymentMode" class="form-select mb-2">
            <option>Espèces</option>
            <option>Wave</option>
            <option>Orange Money</option>
        </select>
        <select id="tenantStatus" class="form-select mb-2">
            <option>Payé</option>
            <option>En retard</option>
            <option>Non payé</option>
        </select>
        <input type="number" id="tenantExpense" class="form-control" placeholder="Dépense (si applicable)">
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-primary" id="saveTenant">Enregistrer</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const { jsPDF } = window.jspdf;
let data = JSON.parse(localStorage.getItem('gestionData')) || [];
let selectedBuildingId = data[0]?.id || null;
let selectedUnitId = data[0]?.unites?.[0]?.id || null;
let currentSort = { col:null, asc:true };
let editingTenantId = null;

function saveData(){ localStorage.setItem('gestionData', JSON.stringify(data)); }
function findBuilding(id){ return data.find(b=>b.id===id); }
function findUnit(bid, uid){ return findBuilding(bid)?.unites.find(u=>u.id===uid); }

function renderSelects(){
    const sb=document.getElementById('selectBuilding');
    const su=document.getElementById('selectUnit');
    sb.innerHTML=''; su.innerHTML='';
    data.forEach(b=>{
        const opt=document.createElement('option'); opt.value=b.id; opt.textContent=b.nom;
        if(b.id===selectedBuildingId) opt.selected=true; sb.appendChild(opt);
    });
    const building=findBuilding(selectedBuildingId);
    if(building){
        building.unites.forEach(u=>{
            const opt=document.createElement('option'); opt.value=u.id; opt.textContent=u.nom;
            if(u.id===selectedUnitId) opt.selected=true; su.appendChild(opt);
        });
    }
}

function renderDashboard(tenants){
    document.getElementById('totalTenants').textContent = tenants.length;
    document.getElementById('totalPaid').textContent = tenants.filter(t=>t.status==="Payé").reduce((s,t)=>s+Number(t.rent),0);
    document.getElementById('totalLate').textContent = tenants.filter(t=>t.status==="En retard").reduce((s,t)=>s+Number(t.rent),0);
    document.getElementById('totalExpenses').textContent = tenants.reduce((s,t)=>s+Number(t.expense||0),0);
}

function renderTenantsTable(filter=""){
    const tbody=document.querySelector('#tenantsTable tbody'); tbody.innerHTML='';
    if(!selectedBuildingId) return;
    const building=findBuilding(selectedBuildingId);
    const unitFilter=document.getElementById('unitTypeFilter').value;

    let allTenants = [];
    building.unites.forEach(u=>{
        if(!unitFilter || unitFilter === u.type){
            u.tenants.forEach(t=>{
                allTenants.push({...t, unitId:u.id, unitName:u.nom, unitType:u.type});
            });
        }
    });

    let tenants = allTenants.filter(t=>`${t.name} ${t.status} ${t.unitName}`.toLowerCase().includes(filter.toLowerCase()));

    if(currentSort.col){
        tenants.sort((a,b)=>{
            let valA=a[currentSort.col], valB=b[currentSort.col];
            if(typeof valA==="string") valA=valA.toLowerCase();
            if(typeof valB==="string") valB=valB.toLowerCase();
            return valA<valB? (currentSort.asc?-1:1) : valA>valB? (currentSort.asc?1:-1):0;
        });
    }

    tenants.forEach(t=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${t.name}</td>
        <td>${t.rent}</td>
        <td>${t.date}</td>
        <td>${t.paymentMode}</td>
        <td>${t.status}</td>
        <td>${t.unitName}</td>
        <td>${t.unitType}</td>
        <td>${t.expense || 0}</td>
        <td>
            <button class="btn btn-sm btn-warning me-1">✎</button>
            <button class="btn btn-sm btn-danger">✖</button>
        </td>`;
        tr.querySelector('button.btn-warning').onclick=()=>{
            editingTenantId = t.id;
            document.getElementById('tenantName').value = t.name;
            document.getElementById('tenantRent').value = t.rent;
            document.getElementById('tenantDate').value = t.date;
            document.getElementById('tenantPaymentMode').value = t.paymentMode;
            document.getElementById('tenantStatus').value = t.status;
            document.getElementById('tenantExpense').value = t.expense || '';
            new bootstrap.Modal(document.getElementById('modalTenant')).show();
        };
        tr.querySelector('button.btn-danger').onclick=()=>{
            if(confirm("Supprimer ?")){
                const unit = building.unites.find(u=>u.id===t.unitId);
                if(unit){
                    unit.tenants = unit.tenants.filter(tt=>tt.id!==t.id);
                    saveData(); renderAll(filter);
                }
            }
        };
        tbody.appendChild(tr);
    });
    renderDashboard(tenants);
}

function renderAll(filter=""){ renderSelects(); renderTenantsTable(filter); }

// Sélections
document.getElementById('selectBuilding').onchange = e=>{
    selectedBuildingId=parseInt(e.target.value);
    const building=findBuilding(selectedBuildingId);
    selectedUnitId=building?.unites?.[0]?.id||null;
    renderAll(document.getElementById('searchInput').value);
};
document.getElementById('selectUnit').onchange = e=>{
    selectedUnitId=parseInt(e.target.value);
    renderAll(document.getElementById('searchInput').value);
};
document.getElementById('unitTypeFilter').onchange = e=>renderTenantsTable(document.getElementById('searchInput').value);
document.getElementById('searchInput').oninput = e=>renderTenantsTable(e.target.value);

// Ajouter / Modifier Immeuble / Unité / Locataire
document.getElementById('saveBuilding').onclick = ()=>{
    const name = document.getElementById('inputBuildingName').value.trim();
    if(!name) return alert("Nom requis");
    const id = Date.now(); data.push({id, nom:name, unites:[]});
    selectedBuildingId = id; saveData(); renderAll(); bootstrap.Modal.getInstance(document.getElementById('modalBuilding')).hide();
    document.getElementById('inputBuildingName').value='';
};
document.getElementById('saveUnit').onclick = ()=>{
    const name=document.getElementById('inputUnitName').value.trim();
    const type=document.getElementById('inputUnitType').value;
    if(!name) return alert("Nom requis"); if(!selectedBuildingId) return alert("Sélectionnez un immeuble");
    const building = findBuilding(selectedBuildingId);
    const id = Date.now(); building.unites.push({id, nom:name, type, tenants:[]});
    selectedUnitId=id; saveData(); renderAll(); bootstrap.Modal.getInstance(document.getElementById('modalUnit')).hide();
    document.getElementById('inputUnitName').value=''; document.getElementById('inputUnitType').selectedIndex=0;
};
document.getElementById('saveTenant').onclick = ()=>{
    if(!selectedBuildingId || !selectedUnitId) return alert("Sélectionnez immeuble et unité");
    const name=document.getElementById('tenantName').value.trim();
    const rent=document.getElementById('tenantRent').value;
    const date=document.getElementById('tenantDate').value;
    const paymentMode=document.getElementById('tenantPaymentMode').value;
    const status=document.getElementById('tenantStatus').value;
    const expense=document.getElementById('tenantExpense').value || 0;
    if(!name || !rent || !date) return alert("Champs obligatoires");
    const unit = findUnit(selectedBuildingId, selectedUnitId);
    if(editingTenantId){
        const t = unit.tenants.find(t=>t.id===editingTenantId);
        Object.assign(t,{name,rent,date,paymentMode,status,expense:Number(expense)});
        editingTenantId=null;
    }else{
        unit.tenants.push({id:Date.now(),name,rent,date,paymentMode,status,expense:Number(expense)});
    }
    saveData(); renderAll(document.getElementById('searchInput').value);
    bootstrap.Modal.getInstance(document.getElementById('modalTenant')).hide();
    document.getElementById('tenantName').value=''; document.getElementById('tenantRent').value='';
    document.getElementById('tenantDate').value=''; document.getElementById('tenantPaymentMode').selectedIndex=0;
    document.getElementById('tenantStatus').selectedIndex=0; document.getElementById('tenantExpense').value='';
};

// Supprimer immeuble / unité
document.getElementById('deleteBuilding').onclick=()=>{
    if(!selectedBuildingId) return; if(confirm("Supprimer immeuble ?")){
        data = data.filter(b=>b.id!==selectedBuildingId);
        selectedBuildingId = data[0]?.id||null; selectedUnitId = data[0]?.unites?.[0]?.id||null;
        saveData(); renderAll(document.getElementById('searchInput').value);
    }
};
document.getElementById('deleteUnit').onclick=()=>{
    if(!selectedBuildingId || !selectedUnitId) return; if(confirm("Supprimer unité ?")){
        const building=findBuilding(selectedBuildingId);
        building.unites=building.unites.filter(u=>u.id!==selectedUnitId);
        selectedUnitId = building.unites[0]?.id||null;
        saveData(); renderAll(document.getElementById('searchInput').value);
    }
};

// Tri colonnes
document.querySelectorAll('#tenantsTable th[data-col]').forEach(th=>{
    th.onclick = ()=>{
        const col = th.dataset.col;
        if(currentSort.col===col) currentSort.asc=!currentSort.asc;
        else currentSort={col,asc:true};
        document.querySelectorAll('#tenantsTable th').forEach(t=>t.classList.remove('sorted-asc','sorted-desc'));
        th.classList.add(currentSort.asc?'sorted-asc':'sorted-desc');
        renderTenantsTable(document.getElementById('searchInput').value);
    };
});

// Impression / PDF
function generatePrintContent(){
    const building=findBuilding(selectedBuildingId); if(!building) return "<p>Aucun immeuble</p>";
    const tenants = building.unites.flatMap(u=>u.tenants.map(t=>({...t, unitName:u.nom, unitType:u.type})));
    let html = `<div style="text-align:center;margin-bottom:20px;">
    <h2>🏢 ${building.nom}</h2>
    <p>Total locataires: ${tenants.length} | Loyers payés: ${tenants.filter(t=>t.status==="Payé").reduce((s,t)=>s+Number(t.rent),0)} | 
    Loyers en retard: ${tenants.filter(t=>t.status==="En retard").reduce((s,t)=>s+Number(t.rent),0)} | Dépenses: ${tenants.reduce((s,t)=>s+Number(t.expense||0),0)}</p>
    </div><table border="1" cellspacing="0" cellpadding="5" style="width:100%; border-collapse: collapse;">
    <thead style="background-color:#343a40; color:white;"><tr>
    <th>Locataire / Dépense</th><th>Loyer / Montant</th><th>Date Paiement</th><th>Mode Paiement</th>
    <th>Statut</th><th>Unité</th><th>Type</th><th>Dépense</th></tr></thead><tbody>`;
    building.unites.forEach(u=>{ u.tenants.forEach((t,i)=>{
        const bg=i%2===0?"#f8f9fa":"#ffffff";
        const statusColor=t.status==="Payé"?"#28a745":t.status==="En retard"?"#dc3545":"#ffc107";
        html+=`<tr style="background-color:${bg};">
        <td>${t.name}</td><td>${t.rent}</td><td>${t.date}</td><td>${t.paymentMode}</td>
        <td style="color:white;background-color:${statusColor};text-align:center;">${t.status}</td>
        <td>${u.nom}</td><td>${u.type}</td><td>${t.expense||0}</td></tr>`;
    });});
    html+="</tbody></table><div style='text-align:center;margin-top:20px;font-size:12px;'>Imprimé le "+new Date().toLocaleDateString()+"</div>";
    return html;
}
document.getElementById('btnPrint').onclick = ()=>{
    const printArea=document.getElementById('printArea'); printArea.innerHTML=generatePrintContent();
    printArea.style.display='block'; window.print(); printArea.style.display='none';
};
document.getElementById('btnExportPDF').onclick = ()=>{
    const doc=new jsPDF('p','pt','a4'); const building=findBuilding(selectedBuildingId); if(!building) return alert("Aucun immeuble sélectionné");
    const tenants = building.unites.flatMap(u=>u.tenants.map(t=>({...t, unitName:u.nom, unitType:u.type})));
    doc.setFontSize(16); doc.text(`Gestion Immeubles - ${building.nom}`,40,40);
    doc.setFontSize(12); doc.text(`Total locataires: ${tenants.length} | Loyers payés: ${tenants.filter(t=>t.status==="Payé").reduce((s,t)=>s+Number(t.rent),0)} | Loyers en retard: ${tenants.filter(t=>t.status==="En retard").reduce((s,t)=>s+Number(t.rent),0)} | Dépenses: ${tenants.reduce((s,t)=>s+Number(t.expense||0),0)}`,40,60);
    const columns=["Locataire","Loyer","Date","Mode","Statut","Unité","Type","Dépense"];
    const rows=tenants.map(t=>[t.name,t.rent,t.date,t.paymentMode,t.status,t.unitName,t.unitType,t.expense||0]);
    doc.autoTable({startY:80, head:[columns], body:rows, styles:{fontSize:10}, headStyles:{fillColor:[52,58,64],textColor:255}, alternateRowStyles:{fillColor:[248,249,250]}, didDrawPage:data=>{const pageCount=doc.getNumberOfPages(); doc.setFontSize(10); doc.text(`Page ${doc.internal.getCurrentPageInfo().pageNumber} / ${pageCount}`, data.settings.margin.left, doc.internal.pageSize.height-10);}});
    doc.save(`gestion_immeubles_${building.nom}.pdf`);
};

renderAll();
</script>
</body>
</html>
