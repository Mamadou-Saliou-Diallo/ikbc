<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion Immeubles Pro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<style>
body { padding: 20px; background-color: #f8f9fa; font-family: "Segoe UI", sans-serif; }
.table-container { max-height: 400px; overflow-y: auto; margin-top:20px; }
#tenantsTable tbody tr:nth-child(odd) { background-color: #ffffff; }
#tenantsTable tbody tr:nth-child(even) { background-color: #e9ecef; }
#tenantsTable tbody tr:hover { background-color: #d1ecf1; transition:0.3s; }
th { cursor: pointer; }
th.sorted-asc::after { content: " ▲"; }
th.sorted-desc::after { content: " ▼"; }
select, input { min-width: 120px; }
.logo { max-height: 60px; margin-bottom: 15px; }
.btn { box-shadow: 0 2px 5px rgba(0,0,0,0.15); transition: 0.2s; }
.btn:hover { transform: translateY(-2px); }
.card { box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s; }
.card:hover { transform: translateY(-2px); }
.modal-content { border-radius: 12px; }
@media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; top: 0; left: 0; width: 100%; }
}
</style>
</head>
<body>

<div class="container">
    <div class="text-center mb-3">
        <h2 class="mb-3">Gestion Immeubles et Locataires Pro</h2>
    </div>

    <!-- Dashboard -->
    <div class="row mb-3" id="dashboard">
        <div class="col-md-4 mb-2">
            <div class="card text-bg-primary text-center">
                <div class="card-body">
                    <h5 class="card-title">Total Locataires</h5>
                    <p class="card-text fs-4" id="totalTenants">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-2">
            <div class="card text-bg-success text-center">
                <div class="card-body">
                    <h5 class="card-title">Loyers Payés</h5>
                    <p class="card-text fs-4" id="totalPaid">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-2">
            <div class="card text-bg-danger text-center">
                <div class="card-body">
                    <h5 class="card-title">Loyers En Retard</h5>
                    <p class="card-text fs-4" id="totalLate">0</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Gestion immeubles et unités -->
    <div class="mb-3">
        <label for="selectBuilding" class="form-label">Immeuble :</label>
        <select id="selectBuilding" class="form-select"></select>
        <button class="btn btn-success mt-2" data-bs-toggle="modal" data-bs-target="#modalBuilding">Ajouter Immeuble</button>
        <button class="btn btn-danger mt-2" id="deleteBuilding">Supprimer Immeuble</button>
    </div>

    <div class="mb-3">
        <label for="selectUnit" class="form-label">Unité :</label>
        <select id="selectUnit" class="form-select"></select>
        <button class="btn btn-success mt-2" data-bs-toggle="modal" data-bs-target="#modalUnit">Ajouter Unité</button>
        <button class="btn btn-danger mt-2" id="deleteUnit">Supprimer Unité</button>
    </div>

    <div class="mb-3 d-flex gap-2">
        <input id="searchInput" class="form-control" placeholder="Recherche par locataire, statut ou unité">
        <select id="unitTypeFilter" class="form-select">
            <option value="">Tous les types</option>
            <option>Appartement</option>
            <option>Studio</option>
            <option>Magasin</option>
            <option>Autre</option>
        </select>
    </div>

    <!-- Table locataires -->
    <div class="table-container mb-3">
        <table class="table table-bordered table-striped" id="tenantsTable">
            <thead class="table-dark">
                <tr>
                    <th data-col="name">Locataire</th>
                    <th data-col="rent">Loyer</th>
                    <th data-col="date">Date Paiement</th>
                    <th data-col="paymentMode">Mode Paiement</th>
                    <th data-col="status">Statut</th>
                    <th>Unité</th>
                    <th>Type</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="mb-4">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTenant">Ajouter un locataire</button>
        <button id="btnPrint" class="btn btn-secondary">Imprimer</button>
        <button id="btnExportPDF" class="btn btn-danger">Exporter en PDF</button>
    </div>
</div>

<!-- Modales -->
<!-- Immeuble -->
<div class="modal fade" id="modalBuilding" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Ajouter Immeuble</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><input type="text" id="inputBuildingName" class="form-control" placeholder="Nom de l'immeuble"></div>
      <div class="modal-footer"><button type="button" class="btn btn-primary" id="saveBuilding">Enregistrer</button></div>
    </div>
  </div>
</div>

<!-- Unité -->
<div class="modal fade" id="modalUnit" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Ajouter Unité</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="text" id="inputUnitName" class="form-control mb-2" placeholder="Nom de l'unité">
        <select id="inputUnitType" class="form-select">
            <option>Appartement</option>
            <option>Studio</option>
            <option>Magasin</option>
            <option>Autre</option>
        </select>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-primary" id="saveUnit">Enregistrer</button></div>
    </div>
  </div>
</div>

<!-- Locataire -->
<div class="modal fade" id="modalTenant" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Ajouter Locataire</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="text" id="tenantName" class="form-control mb-2" placeholder="Nom">
        <input type="number" id="tenantRent" class="form-control mb-2" placeholder="Loyer">
        <input type="date" id="tenantDate" class="form-control mb-2">
        <select id="tenantPaymentMode" class="form-select mb-2">
            <option>Espèces</option>
            <option>Wave</option>
            <option>Orange Money</option>
        </select>
        <select id="tenantStatus" class="form-select">
            <option>Payé</option>
            <option>En retard</option>
            <option>Non payé</option>
        </select>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-primary" id="saveTenant">Enregistrer</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const { jsPDF } = window.jspdf;
let data = JSON.parse(localStorage.getItem('gestionData')) || [];
let selectedBuildingId = data[0]?.id || null;
let selectedUnitId = data[0]?.unites?.[0]?.id || null;
let currentSort = { col:null, asc:true };

function saveData(){ localStorage.setItem('gestionData', JSON.stringify(data)); }
function findBuilding(id){ return data.find(b=>b.id===id); }
function findUnit(bid, uid){ return findBuilding(bid)?.unites.find(u=>u.id===uid); }

function renderSelects(){
    const sb=document.getElementById('selectBuilding');
    const su=document.getElementById('selectUnit');
    sb.innerHTML=''; su.innerHTML='';
    data.forEach(b=>{
        const opt=document.createElement('option'); opt.value=b.id; opt.textContent=b.nom;
        if(b.id===selectedBuildingId) opt.selected=true; sb.appendChild(opt);
    });
    const building=findBuilding(selectedBuildingId);
    if(building){
        building.unites.forEach(u=>{
            const opt=document.createElement('option'); opt.value=u.id; opt.textContent=u.nom;
            if(u.id===selectedUnitId) opt.selected=true; su.appendChild(opt);
        });
    }
}

function renderDashboard(){
    if(!selectedBuildingId||!selectedUnitId) return;
    const unit=findUnit(selectedBuildingId, selectedUnitId);
    const tenants = unit.tenants;
    document.getElementById('totalTenants').textContent = tenants.length;
    document.getElementById('totalPaid').textContent = tenants.filter(t=>t.status==="Payé").reduce((s,t)=>s+Number(t.rent),0);
    document.getElementById('totalLate').textContent = tenants.filter(t=>t.status==="En retard").reduce((s,t)=>s+Number(t.rent),0);
}

function renderTenantsTable(filter=""){
    const tbody=document.querySelector('#tenantsTable tbody'); tbody.innerHTML='';
    if(!selectedBuildingId||!selectedUnitId) return;
    const unit=findUnit(selectedBuildingId, selectedUnitId);
    let tenants = unit.tenants.filter(t=>`${t.name} ${t.status} ${unit.nom}`.toLowerCase().includes(filter.toLowerCase()));

    const unitFilter=document.getElementById('unitTypeFilter').value;
    if(unitFilter) tenants = tenants.filter(t=>unit.type===unitFilter);

    if(currentSort.col){
        tenants.sort((a,b)=>{
            let valA=a[currentSort.col], valB=b[currentSort.col];
            if(typeof valA==="string") valA=valA.toLowerCase();
            if(typeof valB==="string") valB=valB.toLowerCase();
            return valA<valB? (currentSort.asc?-1:1) : valA>valB? (currentSort.asc?1:-1):0;
        });
    }

    tenants.forEach((t,i)=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td><input class="form-control form-control-sm" value="${t.name}"></td>
        <td><input class="form-control form-control-sm" value="${t.rent}"></td>
        <td><input type="date" class="form-control form-control-sm" value="${t.date}"></td>
        <td><select class="form-select form-select-sm">
                <option ${t.paymentMode==="Espèces"?'selected':''}>Espèces</option>
                <option ${t.paymentMode==="Wave"?'selected':''}>Wave</option>
                <option ${t.paymentMode==="Orange Money"?'selected':''}>Orange Money</option>
        </select></td>
        <td><select class="form-select form-select-sm">
                <option ${t.status==="Payé"?'selected':''}>Payé</option>
                <option ${t.status==="En retard"?'selected':''}>En retard</option>
                <option ${t.status==="Non payé"?'selected':''}>Non payé</option>
        </select></td>
        <td>${unit.nom}</td><td>${unit.type}</td>
        <td><button class="btn btn-sm btn-success">✔</button>
            <button class="btn btn-sm btn-danger">✖</button></td>`;
        tr.querySelector('button.btn-success').onclick=()=>{ 
            t.name=tr.children[0].firstChild.value;
            t.rent=tr.children[1].firstChild.value;
            t.date=tr.children[2].firstChild.value;
            t.paymentMode=tr.children[3].firstChild.value;
            t.status=tr.children[4].firstChild.value;
            saveData(); renderAll(filter); 
        };
        tr.querySelector('button.btn-danger').onclick=()=>{ 
            if(confirm("Supprimer ce locataire ?")){ unit.tenants.splice(i,1); saveData(); renderAll(filter); } 
        };
        tbody.appendChild(tr);
    });
    renderDashboard();
}

function renderAll(filter=""){ renderSelects(); renderTenantsTable(filter); }

document.getElementById('selectBuilding').onchange = e=>{
    selectedBuildingId=parseInt(e.target.value);
    const building=findBuilding(selectedBuildingId);
    selectedUnitId=building.unites[0]?.id||null;
    renderAll(document.getElementById('searchInput').value);
};
document.getElementById('selectUnit').onchange = e=>{
    selectedUnitId=parseInt(e.target.value);
    renderAll(document.getElementById('searchInput').value);
};
document.getElementById('unitTypeFilter').onchange = e=>renderTenantsTable(document.getElementById('searchInput').value);

document.getElementById('saveBuilding').onclick = ()=>{
    const name=document.getElementById('inputBuildingName').value.trim();
    if(!name) return alert("Nom requis");
    const id=Date.now();
    data.push({id,nom:name,unites:[]});
    saveData(); selectedBuildingId=id;
    renderAll(); 
    bootstrap.Modal.getInstance(document.getElementById('modalBuilding')).hide();
    document.getElementById('inputBuildingName').value='';
};

document.getElementById('saveUnit').onclick = ()=>{
    if(!selectedBuildingId) return alert("Sélectionnez un immeuble d'abord");
    const name=document.getElementById('inputUnitName').value.trim();
    if(!name) return alert("Nom requis");
    const type=document.getElementById('inputUnitType').value;
    const building=findBuilding(selectedBuildingId);
    const id=Date.now();
    building.unites.push({id,nom:name,type,tenants:[]});
    saveData(); selectedUnitId=id; renderAll(); 
    bootstrap.Modal.getInstance(document.getElementById('modalUnit')).hide();
    document.getElementById('inputUnitName').value='';
};

document.getElementById('saveTenant').onclick = ()=>{
    if(!selectedBuildingId||!selectedUnitId) return alert("Sélectionnez immeuble et unité");
    const name=document.getElementById('tenantName').value.trim();
    const rent=document.getElementById('tenantRent').value;
    const date=document.getElementById('tenantDate').value;
    const paymentMode=document.getElementById('tenantPaymentMode').value;
    const status=document.getElementById('tenantStatus').value;
    if(!name||!rent||!date) return alert("Tous les champs sont requis");
    const unit=findUnit(selectedBuildingId, selectedUnitId);
    unit.tenants.push({name,rent,date,paymentMode,status});
    saveData(); renderAll(document.getElementById('searchInput').value);
    document.getElementById('tenantName').value='';
    document.getElementById('tenantRent').value='';
    document.getElementById('tenantDate').value='';
    document.getElementById('tenantPaymentMode').selectedIndex=0;
    document.getElementById('tenantStatus').selectedIndex=0;
};

document.getElementById('deleteBuilding').onclick = ()=>{
    if(!selectedBuildingId) return alert("Aucun immeuble sélectionné");
    if(confirm("Supprimer cet immeuble et toutes ses unités et locataires ?")){
        data=data.filter(b=>b.id!==selectedBuildingId);
        selectedBuildingId=data[0]?.id||null;
        selectedUnitId=data[0]?.unites?.[0]?.id||null;
        saveData(); renderAll();
    }
};

document.getElementById('deleteUnit').onclick = ()=>{
    if(!selectedUnitId) return alert("Aucune unité sélectionnée");
    const building=findBuilding(selectedBuildingId);
    if(confirm("Supprimer cette unité et tous ses locataires ?")){
        building.unites=building.unites.filter(u=>u.id!==selectedUnitId);
        selectedUnitId=building.unites[0]?.id||null;
        saveData(); renderAll();
    }
};

document.getElementById('searchInput').oninput = e=>renderTenantsTable(e.target.value);

// ======================
// Impression et PDF améliorés
// ======================
function generatePdfOrPrint(printOnly=false){
    const unit = findUnit(selectedBuildingId, selectedUnitId);
    if(!unit) return alert("Sélectionnez une unité avec locataires");
    const tenants = unit.tenants;

    if(printOnly){
        const printWindow = window.open('', '', 'height=800,width=1200');
        let html = `<h2 style="text-align:center;">Liste des locataires - ${unit.nom} (${unit.type})</h2>`;
        html += `<table border="1" cellspacing="0" cellpadding="5" style="width:100%;border-collapse:collapse;">
            <thead style="background-color:#0d6efd;color:white;">
            <tr>
                <th>Nom</th><th>Loyer</th><th>Date Paiement</th><th>Mode Paiement</th><th>Statut</th><th>Unité</th><th>Type</th>
            </tr></thead><tbody>`;
        tenants.forEach(t=>{
            let bgColor=t.status==="Payé"?"#d4edda": t.status==="En retard"?"#f8d7da":"#fff3cd";
            html += `<tr style="background-color:${bgColor};">
                <td>${t.name}</td><td>${t.rent}</td><td>${t.date}</td><td>${t.paymentMode}</td>
                <td>${t.status}</td><td>${unit.nom}</td><td>${unit.type}</td>
            </tr>`;
        });
        html += `</tbody></table>`;
        printWindow.document.write(html);
        printWindow.document.close();
        printWindow.print();
    } else {
        const doc = new jsPDF();
        doc.setFontSize(14);
        doc.text(`Liste des locataires - ${unit.nom} (${unit.type})`, 14, 15);
        const rows = tenants.map(t=>[
            t.name, t.rent, t.date, t.paymentMode, t.status, unit.nom, unit.type
        ]);
        const styles = { headStyles:{ fillColor:[13,110,253], textColor:255 }, bodyStyles:{ fontSize:10 }, startY:25 };
        doc.autoTable({
            head:[["Nom","Loyer","Date Paiement","Mode Paiement","Statut","Unité","Type"]],
            body:rows,
            ...styles,
            didParseCell: function(data){
                if(data.section==="body" && data.column.index===4){
                    const val = data.cell.raw;
                    if(val==="Payé") data.cell.styles.fillColor=[212,237,218];
                    else if(val==="En retard") data.cell.styles.fillColor=[248,215,218];
                    else if(val==="Non payé") data.cell.styles.fillColor=[255,243,205];
                }
            }
        });
        doc.save('locataires.pdf');
    }
}

document.getElementById('btnPrint').onclick = ()=>generatePdfOrPrint(true);
document.getElementById('btnExportPDF').onclick = ()=>generatePdfOrPrint(false);

// Initial render
renderAll();
</script>
</body>
</html>
