<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion Immeubles Pro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body { padding: 20px; }
.table-container { max-height: 400px; overflow-y: auto; margin-top:20px; }
#tenantsTable tbody tr:nth-child(odd) { background-color: #f8f9fa; }
#tenantsTable tbody tr:nth-child(even) { background-color: #ffffff; }
#tenantsTable tbody tr:hover { background-color: #d1ecf1; }
th { cursor: pointer; }
th.sorted-asc::after { content: " ▲"; }
th.sorted-desc::after { content: " ▼"; }
select, input { min-width: 120px; }
.logo { max-height: 60px; margin-bottom: 15px; }
@media print {
    body * { visibility: hidden; }
    #tenantsTable, #tenantsTable * { visibility: visible; }
    #tenantsTable { position: absolute; top: 0; left: 0; width: 100%; }
}
</style>
</head>

    <h2 class="mb-3">Gestion Immeubles et Locataires Pro</h2>

    <!-- Dashboard -->
    <div class="row mb-3" id="dashboard">
        <div class="col-md-4 mb-2">
            <div class="card text-bg-primary">
                <div class="card-body">
                    <h5 class="card-title">Total Locataires</h5>
                    <p class="card-text" id="totalTenants">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-2">
            <div class="card text-bg-success">
                <div class="card-body">
                    <h5 class="card-title">Loyers Payés</h5>
                    <p class="card-text" id="totalPaid">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-2">
            <div class="card text-bg-danger">
                <div class="card-body">
                    <h5 class="card-title">Loyers En Retard</h5>
                    <p class="card-text" id="totalLate">0</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Gestion immeubles et unités -->
    <div class="mb-3">
        <label for="selectBuilding" class="form-label">Immeuble :</label>
        <select id="selectBuilding" class="form-select"></select>
        <button class="btn btn-success mt-2" data-bs-toggle="modal" data-bs-target="#modalBuilding">Ajouter Immeuble</button>
    </div>

    <div class="mb-3">
        <label for="selectUnit" class="form-label">Unité :</label>
        <select id="selectUnit" class="form-select"></select>
        <button class="btn btn-success mt-2" data-bs-toggle="modal" data-bs-target="#modalUnit">Ajouter Unité</button>
    </div>

    <div class="mb-3">
        <input id="searchInput" class="form-control" placeholder="Recherche par locataire, statut ou unité">
    </div>

    <!-- Table locataires -->
    <div class="table-container mb-3">
        <table class="table table-bordered table-striped" id="tenantsTable">
            <thead class="table-dark">
                <tr>
                    <th data-col="name">Locataire</th>
                    <th data-col="rent">Loyer</th>
                    <th data-col="date">Date Paiement</th>
                    <th data-col="paymentMode">Mode Paiement</th>
                    <th data-col="status">Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTenant">Ajouter un locataire</button>
    <button id="btnPrint" class="btn btn-secondary">Imprimer</button>
    <button id="btnExportPDF" class="btn btn-danger">Exporter en PDF</button>
</div>

<!-- Modale Immeuble -->
<div class="modal fade" id="modalBuilding" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Ajouter Immeuble</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="text" id="inputBuildingName" class="form-control" placeholder="Nom de l'immeuble">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="saveBuilding">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<!-- Modale Unité -->
<div class="modal fade" id="modalUnit" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Ajouter Unité</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="text" id="inputUnitName" class="form-control mb-2" placeholder="Nom de l'unité">
        <select id="inputUnitType" class="form-select">
            <option>Appartement</option>
            <option>Studio</option>
            <option>Magasin</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="saveUnit">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<!-- Modale Locataire -->
<div class="modal fade" id="modalTenant" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Ajouter Locataire</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="text" id="inputTenantName" class="form-control mb-2" placeholder="Nom">
        <input type="number" id="inputTenantRent" class="form-control mb-2" placeholder="Loyer">
        <input type="date" id="inputTenantDate" class="form-control mb-2">
        <select id="inputTenantPaymentMode" class="form-select mb-2">
            <option>Espèces</option>
            <option>Wave</option>
            <option>Orange Money</option>
        </select>
        <select id="inputTenantStatus" class="form-select">
            <option>Payé</option>
            <option>En retard</option>
            <option>Non payé</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="saveTenant">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const { jsPDF } = window.jspdf;
let data = JSON.parse(localStorage.getItem('gestionData')) || [];
let selectedBuildingId = data[0]?.id || null;
let selectedUnitId = data[0]?.unites?.[0]?.id || null;
let currentSort = { col:null, asc:true };

function saveData(){ localStorage.setItem('gestionData', JSON.stringify(data)); }
function findBuilding(id){ return data.find(b=>b.id===id); }
function findUnit(bid, uid){ return findBuilding(bid).unites.find(u=>u.id===uid); }

function renderSelects(){
    const sb=document.getElementById('selectBuilding');
    const su=document.getElementById('selectUnit');
    sb.innerHTML=''; su.innerHTML='';
    data.forEach(b=>{
        const opt=document.createElement('option'); opt.value=b.id; opt.textContent=b.nom;
        if(b.id===selectedBuildingId) opt.selected=true; sb.appendChild(opt);
    });
    const building=findBuilding(selectedBuildingId);
    if(building){
        building.unites.forEach(u=>{
            const opt=document.createElement('option'); opt.value=u.id; opt.textContent=u.nom;
            if(u.id===selectedUnitId) opt.selected=true; su.appendChild(opt);
        });
    }
}

function renderDashboard(){
    if(!selectedBuildingId||!selectedUnitId) return;
    const unit=findUnit(selectedBuildingId, selectedUnitId);
    const tenants = unit.tenants;
    document.getElementById('totalTenants').textContent = tenants.length;
    document.getElementById('totalPaid').textContent = tenants.filter(t=>t.status==="Payé").reduce((s,t)=>s+Number(t.rent),0);
    document.getElementById('totalLate').textContent = tenants.filter(t=>t.status==="En retard").reduce((s,t)=>s+Number(t.rent),0);
}

function renderTenantsTable(filter=""){
    const tbody=document.querySelector('#tenantsTable tbody'); tbody.innerHTML='';
    if(!selectedBuildingId||!selectedUnitId) return;
    const unit=findUnit(selectedBuildingId, selectedUnitId);
    let tenants = unit.tenants.filter(t=>`${t.name} ${t.status} ${unit.nom}`.toLowerCase().includes(filter.toLowerCase()));

    if(currentSort.col){
        tenants.sort((a,b)=>{
            let valA=a[currentSort.col], valB=b[currentSort.col];
            if(typeof valA==="string") valA=valA.toLowerCase();
            if(typeof valB==="string") valB=valB.toLowerCase();
            return valA<valB? (currentSort.asc?-1:1) : valA>valB? (currentSort.asc?1:-1):0;
        });
    }

    tenants.forEach((t,i)=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`
        <td><input class="form-control form-control-sm" value="${t.name}"></td>
        <td><input class="form-control form-control-sm" value="${t.rent}"></td>
        <td><input type="date" class="form-control form-control-sm" value="${t.date}"></td>
        <td>
            <select class="form-select form-select-sm">
                <option ${t.paymentMode==="Espèces"?'selected':''}>Espèces</option>
                <option ${t.paymentMode==="Wave"?'selected':''}>Wave</option>
                <option ${t.paymentMode==="Orange Money"?'selected':''}>Orange Money</option>
            </select>
        </td>
        <td>
            <select class="form-select form-select-sm">
                <option ${t.status==="Payé"?'selected':''}>Payé</option>
                <option ${t.status==="En retard"?'selected':''}>En retard</option>
                <option ${t.status==="Non payé"?'selected':''}>Non payé</option>
            </select>
        </td>
        <td>
            <button class="btn btn-sm btn-success">✔</button>
            <button class="btn btn-sm btn-danger">✖</button>
        </td>`;
        tr.querySelector('button.btn-success').onclick=()=>{
            t.name=tr.children[0].firstChild.value;
            t.rent=tr.children[1].firstChild.value;
            t.date=tr.children[2].firstChild.value;
            t.paymentMode=tr.children[3].firstChild.value;
            t.status=tr.children[4].firstChild.value;
            saveData();
            renderAll(filter);
        };
        tr.querySelector('button.btn-danger').onclick=()=>{
            if(confirm("Supprimer ce locataire ?")){ unit.tenants.splice(i,1); saveData(); renderAll(filter); }
        };
        tbody.appendChild(tr);
    });
    renderDashboard();
}

function renderAll(filter=""){ renderSelects(); renderTenantsTable(filter); }

// Sélections
document.getElementById('selectBuilding').onchange = e=>{
    selectedBuildingId=parseInt(e.target.value);
    const building=findBuilding(selectedBuildingId);
    selectedUnitId=building.unites[0]?.id||null;
    renderAll(document.getElementById('searchInput').value);
};
document.getElementById('selectUnit').onchange = e=>{
    selectedUnitId=parseInt(e.target.value);
    renderAll(document.getElementById('searchInput').value);
};

// Bouton Enregistrer Immeuble
document.getElementById('saveBuilding').onclick = ()=>{
    const name=document.getElementById('inputBuildingName').value.trim();
    if(!name) return alert("Nom requis");
    const id=Date.now();
    data.push({id,nom:name,unites:[]});
    saveData(); selectedBuildingId=id;
    renderAll(); bootstrap.Modal.getOrCreateInstance(document.getElementById('modalBuilding')).hide();
    document.getElementById('inputBuildingName').value='';
};

// Bouton Enregistrer Unité
document.getElementById('saveUnit').onclick = ()=>{
    if(!selectedBuildingId) return alert("Sélectionnez un immeuble d'abord");
    const name=document.getElementById('inputUnitName').value.trim();
    if(!name) return alert("Nom requis");
    const type=document.getElementById('inputUnitType').value;
    const building=findBuilding(selectedBuildingId);
    if(!building.unites) building.unites=[];
    const id=Date.now();
    building.unites.push({id,nom:name,type,tenants:[]});
    saveData(); selectedUnitId=id; renderAll(); 
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalUnit')).hide();
    document.getElementById('inputUnitName').value='';
};

// Bouton Enregistrer Locataire
document.getElementById('saveTenant').onclick = ()=>{
    if(!selectedBuildingId||!selectedUnitId) return alert("Sélectionnez immeuble et unité");
    const name=document.getElementById('inputTenantName').value.trim();
    const rent=document.getElementById('inputTenantRent').value;
    const date=document.getElementById('inputTenantDate').value;
    const paymentMode=document.getElementById('inputTenantPaymentMode').value;
    const status=document.getElementById('inputTenantStatus').value;
    if(!name||!rent||!date) return alert("Remplir tous les champs");
    const unit=findUnit(selectedBuildingId, selectedUnitId);
    unit.tenants.push({name,rent,date,paymentMode,status});
    saveData(); renderAll(); 
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalTenant')).hide();
    document.getElementById('inputTenantName').value='';
    document.getElementById('inputTenantRent').value='';
    document.getElementById('inputTenantDate').value='';
};

// Recherche instantanée
document.getElementById('searchInput').oninput=e=>renderAll(e.target.value);

// Tri colonnes
document.querySelectorAll('#tenantsTable th[data-col]').forEach(th=>{
    th.onclick=()=>{
        const col=th.getAttribute('data-col');
        if(currentSort.col===col) currentSort.asc=!currentSort.asc;
        else { currentSort.col=col; currentSort.asc=true; }
        document.querySelectorAll('#tenantsTable th').forEach(h=>h.classList.remove('sorted-asc','sorted-desc'));
        th.classList.add(currentSort.asc?'sorted-asc':'sorted-desc');
        renderTenantsTable(document.getElementById('searchInput').value);
    };
});

// Imprimer
document.getElementById('btnPrint').onclick=()=> window.print();

// Export PDF corrigé
document.getElementById('btnExportPDF').onclick = () => {
    if(!selectedBuildingId||!selectedUnitId) return alert("Sélectionnez immeuble et unité");
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const filter = document.getElementById('searchInput').value.toLowerCase();
    const building = findBuilding(selectedBuildingId);
    const unit = findUnit(selectedBuildingId, selectedUnitId);
    const tenants = unit.tenants.filter(t => `${t.name} ${t.status} ${unit.nom}`.toLowerCase().includes(filter));
    const colWidths = [150, 60, 80, 100, 80];
    let y = 40;

    const img = new Image();
    img.src = 'https://via.placeholder.com/200x60?text=Logo+Gestion+Immeubles+Pro';
    img.onload = () => {
        doc.addImage(img,'PNG',40,10,120,35);
        y+=50;

        doc.setFontSize(16); doc.setFont('helvetica','bold');
        doc.text(`Locataires - ${unit.nom} (${building.nom})`,40,y); y+=30;

        doc.setFontSize(12); doc.setFont('helvetica','bold');
        const headers=["Locataire","Loyer","Date","Mode Paiement","Statut"];
        let x=40; doc.setFillColor(52,58,64); doc.rect(x-5, y-12, colWidths.reduce((a,b)=>a+b,0)+20, 20,'F');
        headers.forEach((h,i)=>{ doc.setTextColor(255,255,255); doc.text(h,x,y); x+=colWidths[i]; });
        y+=20; doc.setLineWidth(0.5); doc.line(40,y-5,40+colWidths.reduce((a,b)=>a+b,0),y-5);
        doc.setFont('helvetica','normal'); doc.setTextColor(0,0,0);

        tenants.forEach((t,i)=>{
            let x=40; if(i%2) doc.setFillColor(248,249,250); else doc.setFillColor(255,255,255);
            doc.rect(x-5,y-12,colWidths.reduce((a,b)=>a+b,0)+20,18,'F');
            [t.name,t.rent,t.date,t.paymentMode,t.status].forEach((v,idx)=>{ doc.text(String(v),x,y); x+=colWidths[idx]; });
            y+=20;
            if(y>750){ doc.addPage(); y=40; }
        });

        doc.save(`locataires_${unit.nom}.pdf`);
    };
};

renderAll();
</script>
</body>
</html>
